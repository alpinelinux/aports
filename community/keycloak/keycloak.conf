# Basic settings for running in production. Change accordingly before deploying the server.


## Build options

# !!! After changing one of the build options you have to run `rc-service keycloak rebuild` !!!

# The database vendor.
db=postgres

# If the server should expose healthcheck endpoints.
health-enabled=true

# If the server should expose metrics endpoints.
#metrics-enabled=false

# Enables a vault provider.
#vault=

# Enables/disabled a set of one or more features.
# See https://www.keycloak.org/server/all-config#category-feature.
#features=
#features-disabled=


## Database

# The username of the database user.
#db-username=keycloak

# The password of the database user.
#db-password=

# The full database JDBC URL. If not provided, a default URL is set based on the selected database vendor.
#db-url=jdbc:postgresql://localhost/keycloak

# TLS mode for the database connection: disabled or verify-server.
#db-tls-mode=disabled

# The database schema to be used.
#db-schema=

# The initial size of the connection pool.
#db-pool-initial-size=

# The minimal size of the connection pool.
db-pool-min-size=2

# The maximum size of the connection pool.
db-pool-max-size=20


## Cache

# Defines the cache mechanism: ispn or local.
# "local" disables clustering and should be used only for a single-node setup.
cache=local


## HTTP

# Hostname for the Keycloak server. CHANGE THIS!
hostname=change-me

# The used HTTPS port.
#https-port=8443

# Port of the management interface.
# NOTE: If you change this, update healthcheck_url in /etc/conf.d/keycloak.
#http-management-port=9000

# Scheme of the management interface: inherited or http.
# By default it inherits HTTPS settings from the main server.
# NOTE: If you change this, update healthcheck_url in /etc/conf.d/keycloak.
#http-management-scheme=

# Address on which the management interface listens.
# If not given, the value is inherited from HTTP options.
#http-management-host=

# The file path to a server certificate or certificate chain in PEM format.
# If not exists and the "openssl" command is available, a self-signed
# certificate and key will be automatically generated by the init script.
https-certificate-file=/etc/keycloak/server.crt.pem

# The file path to a private key in PEM format.
https-certificate-key-file=/etc/keycloak/server.key.pem

# The proxy headers that should be accepted by the server: forwarded or xforwarded.
# proxy-headers=forwarded

# Do not attach route to cookies and rely on the session affinity capabilities from reverse proxy
#spi-sticky-session-encoder--infinispan--should-attach-route=false

# Delay before shutting down to allow load balancers to stop routing requests.
#shutdown-delay=1s

# Maximum time to wait for requests and distributed caches during shutdown.
#shutdown-timeout=10s


## Logging

# Enable one or more log handlers in a comma-separated list.
log=console,file

# Set the log file path and filename.
log-file=/var/log/keycloak/keycloak.log

# The log level of the root category or a comma-separated list of individual categories and their levels.
#log-level=info

# Disable Keycloak's built-in log rotation; log files are rotated by logrotate.
log-file-rotation-enabled=false
