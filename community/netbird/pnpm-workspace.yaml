---
# disable script execution for pnpm install; we don't need it because we
# provide native deps from system
allowBuilds:
  esbuild: false
# normally pnpm downloads linux-<arch>-musl.node binaries during build. npm
# does not provide binaries for all the deps on all target architectures, and
# we don't want to download & execute stuff from npm during build anyway, so we
# use overrides to point to system packages instead
overrides:
  lightningcss: link:/usr/share/node_modules/lightningcss
  "@tailwindcss/oxide": link:/usr/share/node_modules/@tailwindcss/oxide
  "rollup": link:/usr/share/node_modules/rollup
  esbuild: $ESBUILD_VER
# also explicitly disable fetching the os/arch specific optionals, ie. binaries
ignoredOptionalDependencies:
- lightningcss-*
- "@rollup/rollup-*"
- "@esbuild/*"
- "@tailwindcss/oxide-*"
