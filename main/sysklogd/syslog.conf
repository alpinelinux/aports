# /etc/syslog.conf - configuration file for syslogd(8)

# Standard log files, split by facility where useful.
auth,authpriv.*			 /var/log/auth.log
*.*;auth,authpriv.none		-/var/log/syslog
cron.*				-/var/log/cron.log
daemon.*			-/var/log/daemon.log
kern.*				-/var/log/kern.log
mail.*				-/var/log/mail.log

# Common informational messages, excluding facilities logged above.
*.=info;*.=notice;*.=warn;\
	auth,authpriv.none;\
	cron,daemon.none;\
	mail.none			-/var/log/messages

# Emergencies are sent to all logged-in users.
*.emerg				*

# Rotate all regular log files at 1 MiB and keep five generations.
rotate_size 1M
rotate_count 5

# Do not listen on UDP/514 by default, while still allowing configured remote
# forwarding.  Set this to 0 to receive remote messages, preferably together
# with one or more peer restrictions.
secure_mode 1

# Package and locally administered configuration snippets.
include /etc/syslog.d/*.conf
