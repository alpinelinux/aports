# OpenVPN OAuth2 authentication
# See https://github.com/jkroepke/openvpn-auth-oauth2/wiki

http:
  # Local listener, typically behind an HTTPS reverse proxy.
  listen: "127.0.0.1:9000"

  # Public base URL used to construct authentication and OIDC callback URLs.
  # baseurl: "https://vpn.example.org"

  # Random generated secret for cookie encryption.
  # NOTE: Automatically generated by the OpenRC service on first start.
  secret: "file:///etc/openvpn-auth-oauth2/http-secret.txt"

  # Trust only the local reverse proxy.
  enable-proxy-headers: true
  trusted-proxies:
    - "127.0.0.1/32"

  # Require browser and VPN client IPs to match.
  # check:
  #   ipaddr: true

oauth2:
  issuer: "https://idp.example.org"
  client:
    id: "openvpn"
    secret: "file:///etc/openvpn-auth-oauth2/client-secret.txt"

  # OAuth 2.0 client authentication method at the token endpoint.
  auth-style: header

  # Restrict access to authorized groups.
  # validate:
  #   groups: ["vpn-users"]

openvpn:
  # OpenVPN management interface socket.
  #
  # Add the following directives to openvpn.conf:
  #   management /run/openvpn/server.sock unix
  #   management-client-user openvpn-auth
  #   management-client-auth
  #   auth-user-pass-optional
  addr: "unix:///run/openvpn/server.sock"

  # Enforces one active OpenVPN session for the username resolved by
  # oauth2.openvpn-username.
  #enforce-unique-user: false

  # Use OIDC identity as the VPN username (OpenVPN >= 2.7).
  # This is useful to use real usernames in OpenVPN statistics.
  override-username: true

log:
  # Send logs to syslog.
  format: syslog
